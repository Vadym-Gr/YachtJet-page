<section class="rent section" id="rent" aria-labelledby="rent-title">
  <div class="container rent__container">
    <div class="rent__content">
      <h2 class="rent__title" id="rent-title">Rent a yacht now</h2>
      <form class="rent__form" data-rent-form aria-labelledby="rent-title">
        <div class="rent__fields">
          <div class="rent__field">
            <label class="visually-hidden" for="rent-full-name"
              >Full Name</label
            >
            <input
              class="rent__input"
              id="rent-full-name"
              name="fullName"
              type="text"
              placeholder="Full Name"
              autocomplete="name"
              minlength="2"
              maxlength="100"
              required
            />
            <p class="rent__error" id="rent-full-name-error" hidden></p>
          </div>
          <div class="rent__field">
            <label class="visually-hidden" for="rent-email">Email</label>
            <input
              class="rent__input"
              id="rent-email"
              name="email"
              type="email"
              placeholder="Email"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              maxlength="254"
              required
            />
            <p class="rent__error" id="rent-email-error" hidden></p>
          </div>
          <div class="rent__field">
            <label class="visually-hidden" for="rent-phone"
              >Phone number (optional)</label
            >
            <input
              class="rent__input"
              id="rent-phone"
              name="phone"
              type="tel"
              placeholder="Phone number"
              autocomplete="tel"
              inputmode="tel"
              maxlength="40"
            />
            <p class="rent__error" id="rent-phone-error" hidden></p>
          </div>
          <div class="rent__field">
            <label class="visually-hidden" for="rent-comment"
              >Comment (optional)</label
            >
            <textarea
              class="rent__input rent__input--comment"
              id="rent-comment"
              name="comment"
              placeholder="Comment"
              rows="4"
              maxlength="2000"
            ></textarea>
            <p class="rent__error" id="rent-comment-error" hidden></p>
          </div>
        </div>
        <button class="button rent__submit" type="submit" disabled>Send</button>
        <p
          class="rent__status"
          data-rent-status
          role="status"
          aria-live="polite"
          hidden
        ></p>
        <noscript
          ><p class="rent__status">
            Enable JavaScript to check your details. Online booking is not
            available yet.
          </p></noscript
        >
      </form>
    </div>
    <picture class="rent__picture">
      <source
        media="(min-width: 1440px)"
        srcset="./img/rent/rent-wide@1x.png 1x, ./img/rent/rent-wide@2x.png 2x"
        width="768"
        height="536"
      />
      <source
        media="(min-width: 1280px)"
        srcset="
          ./img/rent/rent-desktop@1x.png 1x,
          ./img/rent/rent-desktop@2x.png 2x
        "
        width="658"
        height="536"
      />
      <source
        media="(min-width: 768px)"
        srcset="
          ./img/rent/rent-tablet@1x.png 1x,
          ./img/rent/rent-tablet@2x.png 2x
        "
        width="704"
        height="534"
      />
      <img
        class="rent__image"
        src="./img/rent/rent-mobile@1x.png"
        srcset="
          ./img/rent/rent-mobile@1x.png 1x,
          ./img/rent/rent-mobile@2x.png 2x
        "
        alt="Illuminated luxury yacht on calm water with mountains in the distance at dusk"
        width="335"
        height="412"
      />
    </picture>
  </div>
</section>
